<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>oh-my-slam viewer</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "/static/vendor/three/build/three.module.js",
        "three/addons/": "/static/vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <main id="viewport">
      <div id="canvas-host"></div>
    </main>
    <aside id="panel" aria-label="Controls">
      <nav id="tabs" role="tablist">
        <button type="button" role="tab" data-tab="controls" class="active" aria-selected="true">Controls</button>
        <button type="button" role="tab" data-tab="catalogue" id="tab-catalogue-btn" aria-selected="false" hidden>Catalogue</button>
        <button type="button" role="tab" data-tab="cameras" aria-selected="false">Cameras</button>
        <button type="button" role="tab" data-tab="image" id="tab-image-btn" aria-selected="false" hidden>Image</button>
      </nav>
      <section id="tab-controls" class="tab active" role="tabpanel">
        <div class="group" id="group-layers">
          <h2>Layers</h2>
          <div class="rows" id="layers"></div>
          <p id="labels-note" class="hint" role="status" hidden></p>
        </div>
        <div class="group" id="group-cloud">
          <h2>Point cloud</h2>
          <div class="rows" id="cloud-controls"></div>
          <div id="cloud-error" class="error" role="alert" hidden></div>
          <p id="cloud-note" class="hint" hidden></p>
        </div>
      </section>
      <section id="tab-catalogue" class="tab" role="tabpanel">
        <div class="table-wrap">
          <table id="catalogue" data-testid="catalogue">
            <thead><tr><th class="c-sw"></th><th class="c-id num">id</th><th class="c-label">label</th><th class="c-score num">score</th><th class="c-dims num" title="width × depth × height">W×D×H m</th><th class="c-vol num">m³</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
      <section id="tab-cameras" class="tab" role="tabpanel">
        <p class="hint" id="cam-note"></p>
        <div class="table-wrap">
          <table id="cameras" data-testid="cameras">
            <thead><tr><th>camera</th><th class="num">x</th><th class="num">y</th><th class="num">z</th><th></th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
      <section id="tab-image" class="tab" role="tabpanel">
        <img id="segmented" alt="Segmented image">
      </section>
    </aside>
  </div>
  <div id="loading" role="status" aria-live="polite">
    <div class="box">
      <div class="spinner"></div>
      <div id="loading-title">Loading scene…</div>
    </div>
  </div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
